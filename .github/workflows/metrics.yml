name: Metrics

# 每天采一次计数：流量接口只回 14 天，release 下载数只有累计值。
# 采到的写进 docs/metrics/history.csv，再由它渲染 README 的徽章与曲线，
# 三步在同一次运行里完成，人不用碰。

on:
  schedule:
    # 03:17 UTC = 11:17 UTC+8。避开整点：GitHub 的定时任务在整点前后最拥堵，排队会漂。
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  # 写：既要提交 history.csv，也因为 traffic/* 接口要求 push 权限。
  # 只读的 token 打这个接口是 403，不是空数据。
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  snapshot:
    name: 采集快照
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 采集
        env:
          # 流量接口（/traffic/*）要求 fine-grained token 的 Administration (read)，
          # Actions 内置 token 无权授予，实测返回 403 "Resource not accessible by integration"。
          # 所以优先用 secret METRICS_TOKEN；没配就退回内置 token——
          # 此时仓库计数照常，只有流量那一段标「缺凭证」，不写 0。
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/metrics.py --write

      # 图由 CSV 渲染，不手绘。放在采集之后、提交之前，
      # 这样一次提交里同时有数字和由它派生的徽章与曲线，两者不可能不同步。
      - name: 重画统计图并重写 README
        run: python tools/metrics.py --write-readme

      # 缺凭证时图上的浏览曲线是空的。只在日志里发 warning 太隐蔽，
      # 进 Step Summary 才看得到，否则下一个人会以为「没人看」。
      # 按实际写进 CSV 的行数判断，不按 secret 是否存在——token 过期也会 403。
      - name: 流量段状态
        run: |
          python - <<'PY'
          import csv, datetime as dt, os
          tz = dt.timezone(dt.timedelta(hours=8))
          # 平台窗口到昨天为止，今天的格子明天才会出现——所以按「最近 3 天」判断，
          # 按当天判断会永远显示未采集。
          lo = (dt.datetime.now(tz).date() - dt.timedelta(days=3)).isoformat()
          with open("docs/metrics/history.csv", encoding="utf-8") as f:
              n = sum(1 for r in csv.DictReader(f)
                      if r["date"] >= lo and r["source"] == "github_traffic")
          lines = []
          if n:
              lines = ["流量段：最近 3 天写入 %d 行（views / clones 及其 uniques）" % n]
          else:
              lines = [
                  "### 流量段未采集",
                  "",
                  "`/traffic/*` 要求 fine-grained token 的 **Administration: Read-only**，"
                  "内置 `GITHUB_TOKEN` 无权授予，所以这几天的浏览/克隆没有数据（不是 0）。",
                  "",
                  "配好 secret `METRICS_TOKEN` 后下一轮会自动补回 14 天窗口。",
              ]
          path = os.environ.get("GITHUB_STEP_SUMMARY", "summary.md")
          with open(path, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: 提交
        run: |
          if git diff --quiet -- docs/metrics README.md README.en.md; then
            echo "没有变化，不提交" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics README.md README.en.md
          # 用 +8 日期，与 history.csv 里的 date 列同一天；用 UTC 会出现「提交说 11-12、数据是 11-13」
          git commit -m "metrics: 快照 $(TZ=Asia/Shanghai date +%F)"
          git push
          echo "已提交今日快照" >> "$GITHUB_STEP_SUMMARY"

      # 提交之后再判断：数据该留的已经留下，红叉只用来提醒「今天有源真的取不到」。
      # 顺序反过来会导致一次网络抖动就让当天的其余指标一起丢。
      # 缺凭证不在这里处理——那属于配置状态，脚本自己发 warning，不落盘。
      - name: 检查今天有没有源挂掉
        shell: bash
        run: |
          python - <<'PY'
          import csv, datetime as dt, sys
          tz = dt.timezone(dt.timedelta(hours=8))
          today = dt.datetime.now(tz).date().isoformat()
          with open("docs/metrics/history.csv", encoding="utf-8") as f:
              rows = [r for r in csv.DictReader(f)
                      if r["date"] == today and r["metric"] == "_unavailable"]
          for r in rows:
              print("::error title=采集失败::%s — %s" % (r["source"], r["note"]))
          if not rows:
              print("没有失败的数据源")
          sys.exit(1 if rows else 0)
          PY
