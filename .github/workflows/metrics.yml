name: Metrics

# 平台只给当前值，不给历史：流量接口 14 天就删，release 下载数只有累计值没有按天。
# 所以每天抄一次，抄进仓库，变成可以 diff 的字节。这本账的价值随时间增加，
# 停更一天就永远缺一天——这正是它必须自动化、而不是想起来才手动跑的原因。

on:
  schedule:
    # 03:17 UTC = 11:17 UTC+8。避开整点：GitHub 的定时任务在整点前后最拥堵，排队会漂。
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  # 写：既要提交 history.csv，也因为 traffic/* 接口要求 push 权限。
  # 只读的 token 打这个接口是 403，不是空数据。
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  snapshot:
    name: 抄一份快照
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 采集
        env:
          # 流量接口（/traffic/*）要求 fine-grained token 的 Administration (read)，
          # Actions 内置 token 无权授予，实测返回 403 "Resource not accessible by integration"。
          # 所以优先用 secret METRICS_TOKEN；没配就退回内置 token——
          # 此时仓库计数照常，只有流量那一段标「缺凭证」，不写 0。
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/metrics.py --write

      - name: 提交
        run: |
          if git diff --quiet -- docs/metrics; then
            echo "没有变化，不提交" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics
          # 用 +8 日期，与 history.csv 里的 date 列同一天；用 UTC 会出现「提交说 11-12、数据是 11-13」
          git commit -m "metrics: 快照 $(TZ=Asia/Shanghai date +%F)"
          git push
          echo "已提交今日快照" >> "$GITHUB_STEP_SUMMARY"

      # 提交之后再判断：数据该留的已经留下，红叉只用来提醒「今天有源取不到」。
      # 顺序反过来会导致一次网络抖动就让当天的其余指标一起丢。
      #
      # 分两类：缺凭证是已知的权限模型限制（配 METRICS_TOKEN 即修复），只报警告；
      # 其余失败才是真的坏了，让 job 变红。
      - name: 检查今天有没有源挂掉
        shell: bash
        run: |
          python - <<'PY'
          import csv, datetime as dt, sys
          tz = dt.timezone(dt.timedelta(hours=8))
          today = dt.datetime.now(tz).date().isoformat()
          with open("docs/metrics/history.csv", encoding="utf-8") as f:
              rows = [r for r in csv.DictReader(f)
                      if r["date"] == today and r["metric"] == "_unavailable"]
          missing = [r for r in rows if r["note"].startswith("缺凭证")]
          broken = [r for r in rows if not r["note"].startswith("缺凭证")]
          for r in missing:
              print("::warning title=流量数据缺凭证::%s — %s" % (r["source"], r["note"]))
          for r in broken:
              print("::error title=采集失败::%s — %s" % (r["source"], r["note"]))
          if not rows:
              print("全部数据源可用")
          sys.exit(1 if broken else 0)
          PY
