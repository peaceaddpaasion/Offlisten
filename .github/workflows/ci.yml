name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 文档引用
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 所有路径引用是否真实存在
        run: python tools/check-links.py

  syntax:
    name: 语法
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Python 语法
        run: python -m compileall -q engine tools
      - name: JS 语法
        shell: bash
        run: |
          for f in extension/*.js tools/*.js; do
            echo "check $f"
            node --check "$f"
          done

  package:
    name: 打包扩展
    runs-on: windows-latest
    # 用 powershell（Windows PowerShell 5.1）而不是 pwsh：pack.ps1 是按 5.1 写的
    # （见文件头关于 UTF-8 BOM 的注释），并且只在 5.1 上验过。
    # CI 应该复现作者验证过的配置，而不是换一个更"现代"但没人跑过的。
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: pack.ps1（校验 manifest 引用的每个文件）
        shell: powershell
        run: ./tools/pack.ps1
      - name: 校验包内容
        shell: python
        run: |
          import glob, sys, zipfile
          zips = glob.glob("dist/*.zip")
          if not zips:
              sys.exit("pack.ps1 没有产出 zip")
          with zipfile.ZipFile(zips[0]) as z:
              names = z.namelist()
          print("files: %d" % len(names))
          for n in names:
              print("  " + n)
          if "manifest.json" not in names:
              sys.exit("包内缺 manifest.json")
          if any(n.lower().endswith(".svg") for n in names):
              sys.exit("SVG 源文件混进了发行包：只发 PNG")
      - uses: actions/upload-artifact@v7
        with:
          name: extension-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
