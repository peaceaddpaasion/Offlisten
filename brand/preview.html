<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图标候选对照</title>
<style>
  body { margin: 0; padding: 24px; background: #f5f6f7; color: #1c2126;
         font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: #3c4650; }
  .row { display: flex; gap: 28px; flex-wrap: wrap; }
  .card { background: #fff; border: 1px solid #d3d8dd; padding: 16px; }
  .name { font-weight: 600; margin-bottom: 12px; }
  .sizes { display: flex; align-items: flex-end; gap: 16px; }
  .box { text-align: center; }
  .box span { display: block; font-size: 12px; color: #4c5863; margin-top: 6px; }
  .dark { background: #2b3038; padding: 16px; margin-top: 16px; display: flex; align-items: flex-end; gap: 16px; }
  .light { background: #fff; padding: 16px; margin-top: 8px; display: flex; align-items: flex-end; gap: 16px; border: 1px solid #e3e7eb; }
</style>
</head>
<body>
<h1>扩展图标候选</h1>
<p>同一图形在 128 / 48 / 32 / 16 四个尺寸下的真实渲染。工具栏只显示 16 与 32。</p>
<div class="row" id="rows"></div>
<script>
  const names = [
    ["candidate-a-wave.svg", "A · 声波落在字幕轨上"],
    ["candidate-b-lines.svg", "B · 逐行写下的转写（16px 糊）"],
    ["candidate-c-arc.svg", "C · 收音的点与扩散的声弧"],
    ["candidate-d-frame.svg", "D · 字幕框里正在说的那一句"]
  ];
  const sizes = [128, 48, 32, 16];
  const rows = document.getElementById("rows");
  for (const [file, label] of names) {
    const card = document.createElement("div");
    card.className = "card";
    const h = document.createElement("div");
    h.className = "name";
    h.textContent = label;
    const wrap = document.createElement("div");
    wrap.className = "sizes";
    for (const s of sizes) {
      const box = document.createElement("div");
      box.className = "box";
      const img = document.createElement("img");
      img.src = file;
      img.width = s; img.height = s;
      const cap = document.createElement("span");
      cap.textContent = s + "px";
      box.appendChild(img); box.appendChild(cap);
      wrap.appendChild(box);
    }
    card.appendChild(h); card.appendChild(wrap);
    rows.appendChild(card);
  }
</script>
</body>
</html>
